name: Build and deploy to Cloudflare Pages

# Builds the site twice from the same content:
#   private: every note except those marked `draft: true`, deployed to a Pages project behind Cloudflare Access
#   public:  only notes with `publish: true`, deployed to a second Pages project
# The two are separate builds so private titles and text never reach the public search index.
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Repository variables: PUBLIC_SITE_ENABLED = true   turns on the public site (off until then)
#                       PRIVATE_BASE_URL, PUBLIC_BASE_URL   only needed with a custom domain

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: private
            project: research-private
            explicit_publish: false
          - site: public
            project: research-public
            explicit_publish: true
    env:
      # No deploy until the Cloudflare secrets exist, so the build stays green before setup.
      DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (matrix.site == 'private' || vars.PUBLIC_SITE_ENABLED == 'true') }}
      BASE_URL: ${{ matrix.site == 'private' && (vars.PRIVATE_BASE_URL || 'research-private.pages.dev') || (vars.PUBLIC_BASE_URL || 'research-public.pages.dev') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history, so page dates come from commits
          persist-credentials: false # the build never pushes
      - name: Set baseUrl
        run: yq -i '.configuration.baseUrl = strenv(BASE_URL)' quartz.config.yaml
      - name: Keep only notes marked publish true
        if: matrix.explicit_publish
        run: |
          yq -i '(.plugins[] | select(.source == "@quartz-community/explicit-publish") | .enabled) = true' quartz.config.yaml
          # Stop here if the filter did not switch on, so an unfiltered build can never reach the public site.
          test "$(yq '.plugins[] | select(.source == "@quartz-community/explicit-publish") | .enabled' quartz.config.yaml)" = "true"
      - name: Read Quartz version
        id: quartz_version
        run: echo "sha=$(cat quartz.version)" >> "$GITHUB_OUTPUT"
      - name: Build website
        id: quartz
        uses: raven-wing/quartz-action@v0
        with:
          quartz-version: ${{ steps.quartz_version.outputs.sha }}
          config: quartz.config.yaml
          content-dir: content
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ steps.quartz.outputs.output-dir }}" --project-name=${{ matrix.project }} --branch=main
